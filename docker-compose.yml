version: '3.8'

services:
  inside-the-game:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: premier-league-match-intelligence
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
